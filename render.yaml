services:
  - type: web
    name: ser-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: APP_AWS_ACCESS_KEY_ID
        sync: false
      - key: APP_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: APP_AWS_REGION
        sync: false
      - key: APP_AWS_S3_BUCKET_NAME
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
